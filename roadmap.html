<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ML Librarian · roadmap</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#131b2d;--line:#26344e;--text:#edf3ff;--muted:#aab8d0;--blue:#75a7ff;--green:#56d6a0;--amber:#ffca70;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#111b32,var(--bg) 50%);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}.wrap{max-width:1120px;margin:auto;padding:34px 22px 64px}h1{font-size:32px;margin:0 0 4px}h2{font-size:19px;margin:28px 0 12px}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:20px;align-items:start}.badge{padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--amber);white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card,.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.value{font-size:24px;font-weight:700;margin-top:4px}.bar{height:10px;background:#202c43;border-radius:10px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f83f1,#56d6a0);width:0}.phase{margin:20px 0 8px;color:var(--blue);font-weight:700}.task{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:start;margin:8px 0}.dot{width:11px;height:11px;margin:5px;border-radius:50%;background:#64748b}.task.done .dot{background:var(--green)}.task.in_progress .dot{background:var(--amber);box-shadow:0 0 0 4px #ffca7020}.task h3{font-size:15px;margin:0}.task p{margin:4px 0 0;color:var(--muted)}.hours{color:var(--muted);white-space:nowrap}.small{font-size:13px}.inventory{display:flex;flex-wrap:wrap;gap:9px}.chip{background:#1c2940;border:1px solid var(--line);padding:8px 11px;border-radius:9px}.note{border-left:3px solid var(--amber);padding:10px 14px;background:#1b2332;color:var(--muted);margin-top:18px;border-radius:4px}.foot{margin-top:24px;color:var(--muted);font-size:12px}@media(max-width:720px){.cards{grid-template-columns:repeat(2,1fr)}.top{display:block}.badge{display:inline-block;margin-top:12px}.task{grid-template-columns:20px 1fr}.hours{grid-column:2}}
</style></head><body><main class="wrap"><div class="top"><div><h1>ML Librarian</h1><div class="muted">Projektová roadmap · CZ / EN / PL · lokální stav</div></div><div class="badge" id="pace">Načítám…</div></div>
<section class="cards"><div class="card"><div class="muted">Odhadovaný rozsah</div><div class="value" id="estimate">—</div></div><div class="card"><div class="muted">Zaznamenaná práce</div><div class="value" id="actual">—</div></div><div class="card"><div class="muted">Dokončené úkoly</div><div class="value" id="done">—</div></div><div class="card"><div class="muted">Čas od zahájení měření</div><div class="value" id="elapsed">—</div></div></section>
<div class="muted">Plánovaný postup</div><div class="bar"><i id="progress"></i></div><div id="statusnote" class="note"></div><div id="tasks"></div>
<h2>Inventura vstupního kurzu</h2><div id="inventory" class="inventory"></div><div class="foot">Automatické obnovení každých 30 s · údaje se načítají z roadmap.json v tomto workspace.</div></main>
<script>
const $=id=>document.getElementById(id);const fmt=n=>`${Number(n).toFixed(1)} h`;function elapsedSince(t){let s=Math.max(0,Math.floor((Date.now()-Date.parse(t))/1000));return `${Math.floor(s/3600)} h ${Math.floor(s%3600/60)} min`}
async function load(){try{let d=await(await fetch('roadmap.json?t='+Date.now())).json();let done=d.tasks.filter(t=>t.status==='done').length,active=d.tasks.find(t=>t.status==='in_progress');let completedEstimate=d.tasks.filter(t=>t.status==='done').reduce((a,t)=>a+t.estimate_hours,0);$('estimate').textContent=((d.human_equivalent_hours/d.agent_speedup_max).toFixed(1)+'–'+(d.human_equivalent_hours/d.agent_speedup_min).toFixed(1)+' h agentní; '+d.human_equivalent_hours+' h lidský ekvivalent');$('actual').textContent=fmt(d.recorded_actual_hours);$('done').textContent=`${done} / ${d.tasks.length}`;$('elapsed').textContent=elapsedSince(d.actual_tracking_started_at);$('progress').style.width=`${100*completedEstimate/d.total_estimate_hours}%`;$('statusnote').textContent=d.status_note+' Odhadový postup: '+fmt(completedEstimate)+' dokončeno'+(active?'; právě probíhá: '+active.title:'')+'.';let delta=d.recorded_actual_hours-completedEstimate;let pace=delta<-.25?'Napřed podle zaznamenaného času':delta>.25?'Ve skluzu podle zaznamenaného času':'Podle plánu';$('pace').textContent= d.recorded_actual_hours===0?'Agentní plán 5–10× rychlejší; aktivní čas zatím neměříme':pace;$('tasks').innerHTML='';let phases=[...new Set(d.tasks.map(t=>t.phase))];for(const ph of phases){let h=document.createElement('div');h.className='phase';h.textContent=ph;$('tasks').append(h);for(const t of d.tasks.filter(x=>x.phase===ph)){let row=document.createElement('div');row.className='task '+t.status;let state=t.status==='done'?'Hotovo':t.status==='in_progress'?'Probíhá':'Čeká';row.innerHTML=`<span class="dot"></span><div><h3>${t.title} <span class="muted small">· ${state}</span></h3><p>${t.detail||''}</p></div><div class="hours">${fmt(t.estimate_hours)}</div>`;$('tasks').append(row)}}$('inventory').innerHTML=Object.entries(d.inventory).filter(([k])=>!k.startsWith('excluded_')).map(([k,v])=>`<span class="chip">${k.replaceAll('_',' ')}: <b>${v}</b></span>`).join('')}catch(e){$('pace').textContent='Roadmap data se nepodařilo načíst'}}load();setInterval(load,30000);
</script></body></html>
